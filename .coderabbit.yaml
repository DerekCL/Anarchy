version: 1

reviews:
  request_changes_workflow: true
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true

  # File filters specific to Python
  path_filters:
    - "**/*.py"
    - "!legacy/**"
    - "!tests/legacy/**"

  auto_review:
    enabled: true
    ignore_title_keywords:
      - WIP
      - DO NOT MERGE
      - DRAFT
    drafts: true
    max_file_changes: 20
    min_approval_required: 1

# Analysis settings
analysis:
  languages:
    - python

  checks:
    - name: best-practices
      enabled: true
      options:
        max_cognitive_complexity: 10
        max_function_length: 40
        enforce_explicit_variable_names: true
        discourage_global_variables: true

    - name: performance
      enabled: true
      options:
        check_n_plus_one: true
        detect_unnecessary_list_comprehensions: true
        check_async_contexts: true

    - name: security
      enabled: true
      options:
        validate_input_sanitization: true
        check_dependency_versions: true
        prevent_eval_exec_usage: true

    - name: coverage
      enabled: true
      options:
        coverage_threshold_python: 85

# Style settings
style:
  python:
    indent_size: 4
    max_line_length: 88
    quote_type: single
    enforce_pep8: true
    enforce_type_hints: true
    enforce_docstrings: true

# Custom rules
custom_rules:
  trading_sim_engine:
    max_function_length: 35
    cyclomatic_complexity: 8
    require_tests_for_new_features: true
    strict_type_checking: true
    allow_data_classes: true
    prohibited_patterns:
      - from typing import Any
      - assert False

# Notifications & Additional Reporting
notifications:
  pull_request_summary: true
  custom_alerts:
    - alert: Cognitive Complexity Too High
      trigger: checks.best-practices.max_cognitive_complexity
    - alert: Blocking eval/exec usage
      trigger: checks.security.prevent_eval_exec_usage
    - alert: Test Coverage Below Threshold
      trigger: checks.coverage.coverage_threshold_python

# TDD Guidance
tdd:
  default_test_framework: pytest
  enforce_minimum_tests_per_feature: true
  suggest_test_patterns:
    - Arrange-Act-Assert
    - Given-When-Then

# Tools
tools:
  ruff:
    enabled: true
  pylint:
    enabled: true
  mypy:
    enabled: true
    config_file: pyproject.toml
  markdownlint:
    enabled: true
  yamllint:
    enabled: true
  gitleaks:
    enabled: true
  dotenvLint:
    enabled: true
