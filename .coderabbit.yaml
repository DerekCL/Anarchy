version: 1

# Language settings
language: en-US

# Custom tone instructions for Discord bot reviews
tone_instructions: "You are reviewing a Discord bot built with .NET 9. Focus on async patterns, Discord.Net best practices, and modern C# features."

reviews:
  # Review workflow settings
  request_changes_workflow: true
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  
  # File path filters for a Discord bot
  path_filters:
    - "*.cs"         # C# source files
    - "*.csproj"     # Project files
    - "*.sln"        # Solution files
    - "*.json"       # Configuration files
    - "*.yml"        # GitHub workflows
    - "*.yaml"       # Configuration files
    - "!assets/**"   # Ignore asset files
    - "!addons/**"   # Ignore third-party addons
    - "!bin/**"      # Ignore build output
    - "!obj/**"      # Ignore build artifacts
  
  # Style instructions for C# code
  style_instructions: "Follow modern C# 12 patterns. Use file-scoped namespaces, nullable references, and proper async/await. STRONGLY PREFER primary constructors for all new classes, especially services, handlers, and commands. Properties injected via primary constructor should be initialized as readonly fields. Prefer pattern matching and expression-bodied members when appropriate. Follow Discord.Net best practices for async code. Methods should be under 50 lines, use async suffix for async methods, and follow proper exception handling patterns."
  
  # Path-specific instructions for Discord.Net code
  path_instructions:
    - path: "**/Services/*.cs"
      instructions: "Ensure services follow dependency injection patterns using primary constructors, are properly registered, and handle async operations correctly. Services should use ILogger<T> for logging and initialize injected dependencies as readonly fields through the primary constructor."
    
    - path: "**/Handlers/*.cs"
      instructions: "Discord event handlers should use primary constructors for dependency injection, follow async patterns, use Task return types, and properly handle exceptions. All async methods should have 'Async' suffix. Initialize all dependencies as readonly fields via the primary constructor."
    
    - path: "**/Commands/*.cs"
      instructions: "Command handlers should use primary constructors, properly implement Discord.Net patterns, follow async/await best practices, and include proper precondition checks. Initialize all dependencies as readonly fields via the primary constructor."
  
  # Auto-review settings
  auto_review:
    enabled: true
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
      - "DRAFT"
    drafts: false
    max_file_changes: 15
    min_approval_required: 1

# Knowledge base settings for improved context
knowledge_base:
  web_search:
    enabled: true

# Integration with code analysis tools
tools:
  # Integrating with SonarAnalyzer for C# code quality
  sonarqube:
    enabled: true
    options:
      cognitive_complexity_threshold: 15
      bugs_severity_threshold: "CRITICAL"
      code_smells_severity_threshold: "MAJOR"
  
  # Security scanning for Discord.Net applications
  semgrep:
    enabled: true
    config_file: ".semgrep.yml"

# Analysis configuration
analysis:
  # Language settings
  languages:
    - csharp
    
  # These are mapped to CodeRabbit's internal analysis capabilities
  best_practices:
    enabled: true
    max_method_length: 50
    enforce_async_suffix: true
    enforce_nullable_annotations: true
    enforce_file_scoped_namespaces: true
    enforce_discord_client_lifetime: true
    enforce_primary_constructors: true
  
  performance:
    enabled: true
    analyze_linq_usage: true
    analyze_disposable_usage: true
  
  security:
    enabled: true
    analyze_input_validation: true
    analyze_token_handling: true
  
  tests:
    enabled: true
    test_coverage_threshold: 80
    test_naming_convention: "MethodName_Scenario_ExpectedBehavior"
    test_framework: "NUnit"
    test_location_strategy: "same_file"
